# 資金管理
bankroll:
  daily_budget: 10000
  max_bet_ratio: 0.05   # 総資金の5%以下
  kelly_fraction: 0.5   # ハーフケリー
  stop_loss_streak: 3   # 3連敗で当日停止
  min_expected_value: 1.3   # 期待値1.3以上のみ購入（控除率20%を超える必要）
  min_composite_odds: 4.0   # 合成オッズ4倍以上

# レース選別
race_selection:
  max_difficulty: 3     # 難易度4以上は見送り
  max_daily_races: 5    # 1日最大5レース
  min_ev_tickets: 1     # 期待値>1.0の馬券が最低1つ必要

# スクレイピング
scraping:
  request_interval: 2.0    # 最低2秒
  jitter_max: 1.0           # ランダムジッター最大1秒
  max_retries: 3
  user_agent: "KeibaPredictor/1.0 (Research Tool)"
  daily_request_limit: 500

# 過学習防止
overfitting:
  min_trials_for_significance: 200
  roi_divergence_alert: 0.15    # バックテストと実績の乖離15%超で警告
  model_update_interval_days: 30
  outlier_odds_threshold: 100   # 100倍超を外れ値として除外評価
