  - 名: "(3番人気想定馬)"
    枠: 未定
    馬番: 未定
    脚質: 先行
    推定オッズ: 6.0
    sc_base: [10,9,8,8,7,7,6,8,7,7,10,9,8,7,7,8,4]
    v32_adjustments:
      sc3_senshin_tokyo: 0    # 先行×東京2000m = 標準
    v32_total_estimate: 125
    v32_印: "▲3番手（先行×内枠なら粘り込み期待）"
    memo: |
      先行馬×内枠(1,2枠)に入ればsc[7]+1で126pt。
      東京2000mは先行が苦しいが内枠で粘り込みのパターンあり。
      ▲として馬連・ワイドヒモに採用。

