horses:

  # ===== 確認前テンプレート（出走馬確定後に更新必須） =====
  # 枠確定・馬名確定後にv32_totalを計算し印を確定する

  - 名: "(前走重賞好走馬・推定1番人気)"
    枠: 未定
    馬番: 未定
    脚質: 差し
    推定オッズ: 2.5
    sc_base: [11,10,9,9,8,8,6,8,8,7,12,10,9,7,8,8,4]
    v32_adjustments:
      sc3_sashi_tokyo: +2     # 差し×東京直線525m
      sc6_deep_kizu: +1       # ディープ/キズナ系想定
      sc7_naka_waku: +1       # 内枠想定(1,2枠)
    v32_total_estimate: 144
    v32_ev: "(0.072×2.5×0.80)-1 = -0.856 → EV-86%"
    v32_印: "◎本命（スコア最高・ただし低オッズなのでEV確認必須）"
    memo: |
      スコア最高だがオッズ2.5では割高。
      出走確定後に実際オッズを確認。3倍以上でEV改善。
      単勝より3連複の軸として機能させる戦略が正解。

  - 名: "(穴馬候補A・推定5-8番人気)"
    枠: 未定
    馬番: 未定
    脚質: 差し
    推定オッズ: 12.0
    sc_base: [9,9,8,7,7,7,5,8,8,7,9,8,7,7,8,8,4]
    v32_adjustments:
      sc3_sashi_tokyo: +2     # 差し×東京直線
      sc11_odds_gap: +2       # 市場過小評価（12倍以上）
    v32_total_estimate: 119
    v32_ev_estimate: "(0.062×12.0×0.80)-1 = -0.404 → EV-40%"
    v32_印: "△穴A（EV+になれば大穴フォーメーション要員）"
    memo: |
      ★A級7点戦略の核心。
      フローラSは実力未知の3歳牝馬戦。
      上がり3F速い差し馬が12倍前後なら EV+に化ける可能性。
      出走馬確定後に前走時計・上がり3Fを確認する。
      EV = (model_prob × 12.0 × 0.80) - 1 > 0 なら積極買い。

  - 名: "(穴馬候補B・推定8-12番人気)"
    枠: 未定
    馬番: 未定
    脚質: 差し追込
    推定オッズ: 18.0
    sc_base: [9,8,7,7,7,7,4,8,7,7,8,8,7,7,8,8,4]
    v32_adjustments:
      sc3_oikomi_tokyo: +1    # 追込可能（東京長直線）
      sc11_odds_gap: +2       # 市場大幅過小評価（18倍）
    v32_total_estimate: 112
    v32_ev_estimate: "(0.057×18.0×0.80)-1 = -0.179 → EV-18%（惜しい！）"
    v32_印: "△穴B（EVギリギリ。調教次第でEV+に化ける）"
    memo: |
      18倍×まだ底を見せていない3歳牝馬。
      調教で動き良ければEV爆発の可能性あり。
      sc[9]調教を確認し7以上なら採用。
      3連複フォーメーション用として500円×6通り=3,000円で買う。

  - 名: "(2番人気想定馬)"
    枠: 未定
    馬番: 未定
    脚質: 先行差し
    推定オッズ: 4.0
    sc_base: [10,9,8,9,8,8,5,8,8,7,11,9,8,7,8,8,4]
    v32_adjustments:
