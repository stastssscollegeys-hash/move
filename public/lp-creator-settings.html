<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LP Creator - 管理設定</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: #f0f2f5; color: #333; min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
      color: #fff; padding: 24px 32px; display: flex;
      align-items: center; justify-content: space-between;
    }
    .header h1 { font-size: 1.3rem; letter-spacing: 0.05em; }
    .header a {
      color: #a0aec0; text-decoration: none; font-size: 0.9rem;
      padding: 8px 16px; border: 1px solid #4a5568; border-radius: 6px;
      transition: all 0.2s;
    }
    .header a:hover { color: #fff; border-color: #667eea; }

    .container { max-width: 640px; margin: 32px auto; padding: 0 20px; }

    .card {
      background: #fff; border-radius: 12px; padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px;
    }
    .card h2 {
      font-size: 1.1rem; margin-bottom: 24px; color: #2d3748;
      padding-bottom: 8px; border-bottom: 2px solid #667eea;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-weight: bold; margin-bottom: 6px;
      font-size: 0.9rem; color: #4a5568;
    }
    .form-group .hint {
      font-weight: normal; color: #a0aec0; font-size: 0.8rem;
      margin-top: 4px;
    }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0;
      border-radius: 8px; font-size: 0.95rem; font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none; border-color: #667eea;
    }

    .current-value {
      background: #f7fafc; border-radius: 6px; padding: 8px 12px;
      font-size: 0.85rem; color: #718096; margin-bottom: 8px;
    }

    .btn-save {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; border: none; border-radius: 8px; font-size: 1.05rem;
      font-weight: bold; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-save:hover { opacity: 0.9; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; padding: 14px 24px;
      border-radius: 8px; color: #fff; font-size: 0.9rem;
      transform: translateY(100px); opacity: 0;
      transition: all 0.3s ease;
    }
    .toast.visible { transform: translateY(0); opacity: 1; }
    .toast.success { background: #38a169; }
    .toast.error { background: #e53e3e; }

    .env-badge {
      display: inline-block; background: #ebf8ff; color: #2b6cb0;
      padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>LP Creator 管理設定</h1>
    <a href="/lp-creator">LP作成画面に戻る</a>
  </header>

  <div class="container">
    <div class="card">
      <h2>API設定</h2>

      <div class="form-group">
        <label>
          Anthropic APIキー
          <span class="env-badge" id="env-badge" style="display:none">環境変数あり</span>
        </label>
        <div class="current-value" id="current-key">読み込み中...</div>
        <input type="password" id="input-api-key" placeholder="sk-ant-... （変更する場合のみ入力）">
        <div class="hint">空で保存すると環境変数（ANTHROPIC_API_KEY）にフォールバックします</div>
      </div>

      <div class="form-group">
        <label>AIモデル</label>
        <div class="current-value" id="current-model">読み込み中...</div>
        <select id="input-model">
          <option value="">変更しない</option>
          <option value="claude-sonnet-4-5-20250929">Claude Sonnet 4.5（推奨）</option>
          <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5（高速・低コスト）</option>
          <option value="claude-opus-4-6">Claude Opus 4.6（最高品質）</option>
        </select>
      </div>

      <div class="form-group">
        <label>最大出力トークン数</label>
        <div class="current-value" id="current-tokens">読み込み中...</div>
        <input type="number" id="input-tokens" min="1024" max="16384" step="1024"
               placeholder="4096（変更する場合のみ入力）">
        <div class="hint">1024〜16384。大きいほど詳細なコピーが生成されますがコストが上がります</div>
      </div>

      <button type="button" class="btn-save" id="btn-save">設定を保存</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const inputApiKey = document.getElementById('input-api-key');
    const inputModel = document.getElementById('input-model');
    const inputTokens = document.getElementById('input-tokens');
    const btnSave = document.getElementById('btn-save');
    const toast = document.getElementById('toast');

    // --- Load current settings ---
    async function loadSettings() {
      try {
        const res = await fetch('/lp-creator/api/settings');
        const json = await res.json();
        if (json.success) {
          document.getElementById('current-key').textContent = json.data.anthropicApiKey;
          document.getElementById('current-model').textContent = json.data.model;
          document.getElementById('current-tokens').textContent = json.data.maxTokens;
          if (json.data.hasEnvKey) {
            document.getElementById('env-badge').style.display = 'inline-block';
          }
        }
      } catch (e) {
        document.getElementById('current-key').textContent = '読み込みエラー';
      }
    }
    loadSettings();

    // --- Show toast ---
    function showToast(message, type) {
      toast.textContent = message;
      toast.className = 'toast visible ' + type;
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    // --- Save ---
    btnSave.addEventListener('click', async () => {
      btnSave.disabled = true;
      btnSave.textContent = '保存中...';

      const body = {};
      const apiKey = inputApiKey.value.trim();
      if (apiKey || inputApiKey.value === '') {
        // Only send if user typed something or explicitly cleared
        if (inputApiKey.value !== '') {
          body.anthropicApiKey = apiKey;
        }
      }
      const model = inputModel.value;
      if (model) body.model = model;

      const tokens = parseInt(inputTokens.value);
      if (!isNaN(tokens)) body.maxTokens = tokens;

      // Don't send empty body
      if (Object.keys(body).length === 0) {
        showToast('変更がありません', 'error');
        btnSave.disabled = false;
        btnSave.textContent = '設定を保存';
        return;
      }

      try {
        const res = await fetch('/lp-creator/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const json = await res.json();
        if (json.success) {
          showToast(json.message, 'success');
          // Refresh displayed values
          loadSettings();
          // Clear inputs
          inputApiKey.value = '';
          inputModel.value = '';
          inputTokens.value = '';
        } else {
          showToast(json.error || '保存に失敗しました', 'error');
        }
      } catch (e) {
        showToast('通信エラーが発生しました', 'error');
      } finally {
        btnSave.disabled = false;
        btnSave.textContent = '設定を保存';
      }
    });
  </script>

</body>
</html>
