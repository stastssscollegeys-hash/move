<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LP Creator - AIランディングページ生成</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: #f0f2f5; color: #333; min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff; padding: 24px 32px; text-align: center;
    }
    .header h1 { font-size: 1.5rem; letter-spacing: 0.05em; }
    .header p { font-size: 0.9rem; opacity: 0.9; margin-top: 4px; }

    /* Layout */
    .main { display: flex; gap: 24px; padding: 24px; max-width: 1600px; margin: 0 auto; }
    .panel-left { flex: 0 0 420px; }
    .panel-right { flex: 1; min-width: 0; }

    @media (max-width: 900px) {
      .main { flex-direction: column; padding: 16px; }
      .panel-left { flex: none; }
    }

    /* Cards */
    .card {
      background: #fff; border-radius: 12px; padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1.1rem; margin-bottom: 16px; color: #2d3748;
      padding-bottom: 8px; border-bottom: 2px solid #667eea;
    }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-weight: bold; margin-bottom: 6px;
      font-size: 0.9rem; color: #4a5568;
    }
    .form-group .char-count {
      float: right; font-weight: normal; color: #a0aec0; font-size: 0.8rem;
    }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0;
      border-radius: 8px; font-size: 0.95rem; font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none; border-color: #667eea;
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group .error-text { color: #e53e3e; font-size: 0.8rem; margin-top: 4px; display: none; }
    .form-group.has-error input, .form-group.has-error textarea { border-color: #e53e3e; }
    .form-group.has-error .error-text { display: block; }

    /* Submit button */
    .btn-generate {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; border: none; border-radius: 8px; font-size: 1.05rem;
      font-weight: bold; cursor: pointer; transition: opacity 0.2s;
      min-height: 48px;
    }
    .btn-generate:hover { opacity: 0.9; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Streaming area */
    .stream-area {
      background: #1a202c; color: #68d391; border-radius: 8px;
      padding: 16px; font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.85rem; line-height: 1.6; max-height: 300px;
      overflow-y: auto; white-space: pre-wrap; word-break: break-all;
      display: none;
    }
    .stream-area.visible { display: block; }
    .stream-cursor {
      display: inline-block; width: 8px; height: 16px;
      background: #68d391; animation: blink 1s infinite;
      vertical-align: text-bottom; margin-left: 2px;
    }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    /* Status bar */
    .status-bar {
      display: none; align-items: center; gap: 8px; padding: 12px 0;
      font-size: 0.85rem; color: #718096;
    }
    .status-bar.visible { display: flex; }
    .spinner {
      width: 16px; height: 16px; border: 2px solid #e2e8f0;
      border-top-color: #667eea; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-warning { color: #dd6b20; font-weight: bold; }
    .status-error { color: #e53e3e; font-weight: bold; }

    /* Preview area */
    .preview-frame {
      width: 100%; border: none; border-radius: 8px;
      background: #fff; min-height: 600px; display: none;
    }
    .preview-frame.visible { display: block; }
    .preview-placeholder {
      text-align: center; padding: 80px 20px; color: #a0aec0;
    }
    .preview-placeholder p { font-size: 1.1rem; margin-bottom: 8px; }
    .preview-placeholder small { font-size: 0.85rem; }

    /* Error display */
    .error-banner {
      background: #fff5f5; border: 1px solid #feb2b2; border-radius: 8px;
      padding: 16px; color: #c53030; display: none; margin-bottom: 16px;
    }
    .error-banner.visible { display: block; }
  </style>
</head>
<body>

  <header class="header">
    <h1>LP Creator</h1>
    <p>3つの入力からAIがプロ品質のLPを自動生成</p>
  </header>

  <main class="main">
    <!-- Left Panel: Input Form -->
    <div class="panel-left">
      <div class="card">
        <h2>LP情報を入力</h2>

        <div class="form-group" id="fg-product">
          <label>
            商品名
            <span class="char-count"><span id="cc-product">0</span>/100</span>
          </label>
          <input type="text" id="input-product" maxlength="100"
                 placeholder="例: AIコピーライティング講座">
          <div class="error-text">商品名を入力してください</div>
        </div>

        <div class="form-group" id="fg-target">
          <label>
            ターゲット
            <span class="char-count"><span id="cc-target">0</span>/200</span>
          </label>
          <textarea id="input-target" maxlength="200" rows="2"
                    placeholder="例: ブログやSNSで発信しているが、反応が少なくて悩んでいる個人起業家"></textarea>
          <div class="error-text">ターゲットを入力してください</div>
        </div>

        <div class="form-group" id="fg-strength">
          <label>
            強み・特徴
            <span class="char-count"><span id="cc-strength">0</span>/300</span>
          </label>
          <textarea id="input-strength" maxlength="300" rows="3"
                    placeholder="例: プロのコピーライターが監修したAIテンプレート50種類を収録。初心者でも5分で反応率3倍のコピーが書ける"></textarea>
          <div class="error-text">強み・特徴を入力してください</div>
        </div>

        <div style="margin-top: 16px; display: flex; gap: 8px;">
          <button type="button" class="btn-generate" id="btn-generate-demo"
                  style="flex:1; background: linear-gradient(135deg, #38a169, #2f855a);">
            テスト生成（API不要）
          </button>
          <button type="button" class="btn-generate" id="btn-generate"
                  style="flex:1; opacity: 0.6; font-size: 0.9rem;"
                  title="Anthropic APIキーが必要です">
            本番生成（API）
          </button>
        </div>
      </div>

      <!-- Streaming Output -->
      <div class="card">
        <h2>AI出力</h2>
        <div class="status-bar" id="status-bar">
          <div class="spinner"></div>
          <span id="status-text">生成中...</span>
        </div>
        <div class="error-banner" id="error-banner"></div>
        <div class="stream-area" id="stream-area">
          <span id="stream-text"></span><span class="stream-cursor" id="stream-cursor"></span>
        </div>
      </div>
    </div>

    <!-- Right Panel: LP Preview -->
    <div class="panel-right">
      <div class="card" style="padding: 0; overflow: hidden;">
        <div style="padding: 16px 24px; border-bottom: 1px solid #e2e8f0;">
          <h2 style="border: none; padding: 0; margin: 0;">LPプレビュー</h2>
        </div>
        <div id="preview-placeholder" class="preview-placeholder">
          <p>ここにLPが表示されます</p>
          <small>左のフォームに入力して「LP作成」をクリック</small>
        </div>
        <iframe id="preview-frame" class="preview-frame" sandbox="allow-same-origin"></iframe>
      </div>
    </div>
  </main>

  <script>
    // --- DOM Elements ---
    const inputProduct = document.getElementById('input-product');
    const inputTarget = document.getElementById('input-target');
    const inputStrength = document.getElementById('input-strength');
    const btnGenerate = document.getElementById('btn-generate');
    const statusBar = document.getElementById('status-bar');
    const statusText = document.getElementById('status-text');
    const errorBanner = document.getElementById('error-banner');
    const streamArea = document.getElementById('stream-area');
    const streamText = document.getElementById('stream-text');
    const streamCursor = document.getElementById('stream-cursor');
    const previewFrame = document.getElementById('preview-frame');
    const previewPlaceholder = document.getElementById('preview-placeholder');

    // --- Character Counters ---
    function setupCounter(input, countEl) {
      input.addEventListener('input', () => {
        countEl.textContent = input.value.length;
      });
    }
    setupCounter(inputProduct, document.getElementById('cc-product'));
    setupCounter(inputTarget, document.getElementById('cc-target'));
    setupCounter(inputStrength, document.getElementById('cc-strength'));

    // --- Validation ---
    function validate() {
      let valid = true;
      [
        { fg: 'fg-product', input: inputProduct },
        { fg: 'fg-target', input: inputTarget },
        { fg: 'fg-strength', input: inputStrength },
      ].forEach(({ fg, input }) => {
        const group = document.getElementById(fg);
        if (!input.value.trim()) {
          group.classList.add('has-error');
          valid = false;
        } else {
          group.classList.remove('has-error');
        }
      });
      return valid;
    }

    // Clear validation on input
    [inputProduct, inputTarget, inputStrength].forEach(el => {
      el.addEventListener('input', () => {
        el.closest('.form-group').classList.remove('has-error');
      });
    });

    // --- Generate LP ---
    const btnGenerateDemo = document.getElementById('btn-generate-demo');
    let abortController = null;

    async function doGenerate(apiPath) {

      // Reset UI
      btnGenerate.disabled = true;
      btnGenerate.textContent = '生成中...';
      errorBanner.classList.remove('visible');
      errorBanner.textContent = '';
      streamArea.classList.add('visible');
      streamText.textContent = '';
      streamCursor.style.display = 'inline-block';
      statusBar.classList.add('visible');
      statusText.textContent = '生成中...';
      statusText.className = '';
      previewFrame.classList.remove('visible');
      previewPlaceholder.style.display = 'block';

      // Timeout timers
      let warningTimer = null;
      let timeoutTimer = null;

      abortController = new AbortController();

      warningTimer = setTimeout(() => {
        statusText.textContent = '30秒経過 — もう少しお待ちください...';
        statusText.className = 'status-warning';
      }, 30000);

      timeoutTimer = setTimeout(() => {
        statusText.textContent = 'タイムアウト（60秒）';
        statusText.className = 'status-error';
        abortController.abort();
        finish();
      }, 60000);

      function finish() {
        clearTimeout(warningTimer);
        clearTimeout(timeoutTimer);
        btnGenerate.disabled = false;
        btnGenerate.textContent = 'LP作成';
        streamCursor.style.display = 'none';
      }

      try {
        const body = {
          productName: inputProduct.value.trim(),
          target: inputTarget.value.trim(),
          strength: inputStrength.value.trim(),
        };

        const response = await fetch(apiPath, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: abortController.signal,
        });

        // Non-SSE error (validation etc.)
        if (!response.ok && response.headers.get('content-type')?.includes('application/json')) {
          const errData = await response.json();
          throw new Error(errData.error || 'リクエストエラー');
        }

        // Read SSE stream via ReadableStream
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // keep incomplete line

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try {
              const event = JSON.parse(line.slice(6));

              if (event.type === 'chunk') {
                streamText.textContent += event.data;
                // Auto-scroll streaming area
                streamArea.scrollTop = streamArea.scrollHeight;
              } else if (event.type === 'complete') {
                // Show LP preview in iframe
                previewPlaceholder.style.display = 'none';
                previewFrame.classList.add('visible');
                previewFrame.srcdoc = event.data;
                // Auto-resize iframe
                previewFrame.onload = () => {
                  try {
                    const h = previewFrame.contentDocument.documentElement.scrollHeight;
                    previewFrame.style.height = Math.max(h, 600) + 'px';
                  } catch(e) {}
                };
                statusText.textContent = '完了';
                statusText.className = '';
              } else if (event.type === 'error') {
                throw new Error(event.data);
              }
            } catch (parseErr) {
              if (parseErr.message && !parseErr.message.includes('JSON')) {
                throw parseErr;
              }
            }
          }
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          errorBanner.textContent = 'タイムアウトしました。もう一度お試しください。';
        } else {
          errorBanner.textContent = err.message || 'エラーが発生しました';
        }
        errorBanner.classList.add('visible');
        statusText.textContent = 'エラー';
        statusText.className = 'status-error';
      } finally {
        finish();
      }
    }

    // テスト生成ボタン（API不要）
    btnGenerateDemo.addEventListener('click', () => doGenerate('/lp-creator/api/generate-demo'));
    // 本番生成ボタン（API必要）
    btnGenerate.addEventListener('click', () => doGenerate('/lp-creator/api/generate'));
  </script>

</body>
</html>
